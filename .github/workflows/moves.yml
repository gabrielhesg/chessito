name: moves

# Puebla `moves` desde el PGN de cada partida que todavia no tiene sus jugadas guardadas
# (Fase 2). No tiene un disparador serverless (ver CLAUDE.md, "Estado al terminar la Fase 2"):
# hasta ahora se corria a mano con `pnpm moves:extract` en un entorno local, pero la app se
# opera desde el navegador, asi que hace falta poder dispararla igual que `openings`.
#
# Dos modos, ambos idempotentes y ambos sobre la MISMA tabla, por eso viven en el mismo
# workflow en vez de en dos:
#
#   extraer  — `pnpm moves:extract`. `loadGamesForMoves` solo devuelve partidas sin filas en
#              `moves`, asi que correrla de nuevo no encuentra nada pendiente.
#   refasear — `pnpm moves:rephase`. Re-deriva SOLO la columna `phase` desde el PGN, sin tocar
#              nada del motor. La segunda corrida reporta `jugadas_cambiadas: 0`, que es como
#              se comprueba la idempotencia. Lo necesita la Fase 1 de la revision integral: el
#              criterio de fase cambio (lib/chess/phase.ts) y las 579.194 filas ya escritas
#              siguen con el viejo hasta que esto corra.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'extraer = jugadas de partidas nuevas; refasear = re-derivar la columna phase del historico'
        required: false
        default: 'extraer'
        type: choice
        options:
          - extraer
          - refasear
      desde:
        description: 'Solo para "refasear": id de partida desde el que reanudar una corrida cortada'
        required: false
        type: string

jobs:
  extraer:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Extraer jugadas o re-derivar la fase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CHESSCOM_USERNAME: ${{ secrets.CHESSCOM_USERNAME }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          CRON_SECRET: no-aplica-en-actions
          APP_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          MODO: ${{ inputs.modo }}
          DESDE: ${{ inputs.desde }}
        run: |
          if [ "$MODO" = "refasear" ]; then
            if [ -n "$DESDE" ]; then
              pnpm moves:rephase --desde "$DESDE"
            else
              pnpm moves:rephase
            fi
          else
            pnpm moves:extract
          fi

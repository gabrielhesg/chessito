name: ingest

# El camino principal de la ingesta. Cada 3 horas, que es lo que GitHub Actions permite y
# Vercel no (su plan gratuito da un solo cron al dia). El cron de Vercel queda como piso
# garantizado porque Actions desactiva los workflows programados tras 60 dias sin actividad.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      alcance:
        description: 'recent (mes actual y anterior) o full (todo el historico)'
        required: false
        default: recent
        type: choice
        options: [recent, full]

jobs:
  ingerir:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - name: Verificar secretos del ambiente
        id: secretos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::Sin los secretos del ambiente '${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}' (ver docs/DESPLIEGUE.md, paso 8) esta corrida programada no puede ingerir. Se salta sin marcar el workflow en rojo hasta que esten cargados."
            echo "listos=false" >> "$GITHUB_OUTPUT"
          else
            echo "listos=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secretos.outputs.listos == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.secretos.outputs.listos == 'true'
      - uses: actions/setup-node@v4
        if: steps.secretos.outputs.listos == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.secretos.outputs.listos == 'true'
      - name: Ingesta
        if: steps.secretos.outputs.listos == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CHESSCOM_USERNAME: ${{ secrets.CHESSCOM_USERNAME }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          CRON_SECRET: no-aplica-en-actions
          APP_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
        run: pnpm ingest ${{ (inputs.alcance == 'full') && '--full' || '' }}

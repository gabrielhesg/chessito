name: puzzles

# Genera ejercicios desde los blunders reales de Gabriel (Fase 4). Necesita partidas con
# `moves.classification` ya poblado por el motor, asi que `analyze.yml` ya lo corre como su
# ultimo paso (`pnpm puzzles:build`) despues de cada analisis, cron o manual: no tiene su propio
# `schedule` aca, para no duplicar la corrida diaria. Este workflow queda solo para dispararlo a
# mano (backfill por tandas, o forzar una corrida sin esperar al proximo `analyze`).
on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Cuantos candidatos procesar en esta corrida'
        required: false
        default: '200'
        type: string

jobs:
  construir:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    steps:
      - name: Verificar secretos del ambiente
        id: secretos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::Sin los secretos del ambiente 'production' esta corrida programada no puede construir ejercicios. Se salta sin marcar el workflow en rojo hasta que esten cargados."
            echo "listos=false" >> "$GITHUB_OUTPUT"
          else
            echo "listos=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secretos.outputs.listos == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.secretos.outputs.listos == 'true'
      - uses: actions/setup-node@v4
        if: steps.secretos.outputs.listos == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.secretos.outputs.listos == 'true'
      - name: Instalar Stockfish
        if: steps.secretos.outputs.listos == 'true'
        run: |
          curl -fsSL -o stockfish.tar.gz \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
          tar -xzf stockfish.tar.gz
          chmod +x stockfish/stockfish-linux-x86-64-universal
          echo "STOCKFISH_PATH=$PWD/stockfish/stockfish-linux-x86-64-universal" >> "$GITHUB_ENV"
      - name: Calcular hilos disponibles
        id: hilos
        if: steps.secretos.outputs.listos == 'true'
        run: echo "threads=$(( $(nproc) - 1 ))" >> "$GITHUB_OUTPUT"
      - name: Construir ejercicios
        if: steps.secretos.outputs.listos == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CHESSCOM_USERNAME: ${{ secrets.CHESSCOM_USERNAME }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          CRON_SECRET: no-aplica-en-actions
          APP_ENV: prod
          ENGINE_NODES: '800000'
          ENGINE_THREADS: ${{ steps.hilos.outputs.threads }}
        run: pnpm puzzles:build --batch ${{ inputs.batch || '200' }}
